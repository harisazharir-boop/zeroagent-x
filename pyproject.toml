[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroagent"
version = "0.12.0.dev0"
description = "Local-first, proof-driven AI agent framework."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ZEROAGENT X Contributors" }]
keywords = ["agent", "ai", "cli", "local-first", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pathspec>=0.12,<1",
    "pydantic>=2.7,<3",
    "rich>=13.7,<15",
    "typer>=0.12,<1",
    "textual>=0.79,<1",
]

[project.urls]
Repository = "https://github.com/harisazharir-boop/zeroagent-x"
Issues = "https://github.com/harisazharir-boop/zeroagent-x/issues"

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.24,<1",
    "pytest>=8.2,<9",
    "ruff>=0.5,<1",
]

[project.scripts]
zeroagent = "zeroagent.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zeroagent = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
